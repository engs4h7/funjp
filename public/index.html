<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>funjp - Demo & Auth</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 2rem;
    }

    /* Timer Widget */
    .timer-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem 2rem;
      margin-top: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .timer-display {
      font-size: 3rem;
      font-weight: 700;
      color: #38bdf8;
      font-family: monospace;
      margin: 0.5rem 0;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Modal Box */
    .modal {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.375rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      box-sizing: border-box;
      font-size: 1rem;
    }

    .form-group input:focus {
      outline: 2px solid var(--primary);
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 0.5rem;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .toggle-text {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .toggle-text a {
      color: #38bdf8;
      text-decoration: none;
      cursor: pointer;
    }

    .message {
      margin-top: 1rem;
      font-size: 0.875rem;
      text-align: center;
    }

    .message.error { color: #f87171; }
    .message.success { color: #4ade80; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome to funjp</h1>
    <p style="color: var(--text-muted);">Explore the app. You have a 2-minute live demo session.</p>

    <div class="timer-card">
      <div>Demo Time Remaining</div>
      <div id="timerDisplay" class="timer-display">02:00</div>
      <div id="statusText" style="font-size: 0.875rem; color: var(--text-muted);">Demo session active</div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Demo Expired - Log In</h2>
        <p style="color: var(--text-muted); font-size: 0.875rem;">Please log in or register to continue using funjp.</p>
      </div>

      <form id="authForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>

        <button type="submit" id="submitBtn" class="btn">Log In</button>
      </form>

      <div id="authMessage" class="message"></div>

      <div class="toggle-text">
        <span id="toggleQuestion">Don't have an account?</span> 
        <a id="toggleAuthMode">Sign Up</a>
      </div>
    </div>
  </div>

  <script>
    // State Variables
    let isRegistering = false;
    let timerInterval = null;
    let duration = 120; // 2 minutes in seconds

    const timerDisplay = document.getElementById('timerDisplay');
    const authModal = document.getElementById('authModal');
    const authForm = document.getElementById('authForm');
    const modalTitle = document.getElementById('modalTitle');
    const submitBtn = document.getElementById('submitBtn');
    const toggleAuthMode = document.getElementById('toggleAuthMode');
    const toggleQuestion = document.getElementById('toggleQuestion');
    const authMessage = document.getElementById('authMessage');

    // Start 2-Minute Demo Timer
    function startDemoTimer() {
      let timeRemaining = duration;

      timerInterval = setInterval(() => {
        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;

        timerDisplay.textContent = 
          `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          document.getElementById('statusText').textContent = "Demo session finished.";
          showAuthModal();
        }

        timeRemaining--;
      }, 1000);
    }

    function showAuthModal() {
      authModal.classList.add('active');
    }

    // Toggle between Login and Signup modes
    toggleAuthMode.addEventListener('click', () => {
      isRegistering = !isRegistering;
      authMessage.textContent = '';
      
      if (isRegistering) {
        modalTitle.textContent = "Create an Account";
        submitBtn.textContent = "Sign Up";
        toggleQuestion.textContent = "Already have an account?";
        toggleAuthMode.textContent = "Log In";
      } else {
        modalTitle.textContent = "Welcome Back";
        submitBtn.textContent = "Log In";
        toggleQuestion.textContent = "Don't have an account?";
        toggleAuthMode.textContent = "Sign Up";
      }
    });

    // Handle Form Submission -> Netlify Function
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authMessage.textContent = '';
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const action = isRegistering ? 'register' : 'login';

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = "Connecting...";

        const response = await fetch('/.netlify/functions/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          authMessage.className = "message success";
          authMessage.textContent = data.message || "Success!";
          
          if (data.token) {
            localStorage.setItem('funjp_token', data.token);
          }

          setTimeout(() => {
            authModal.classList.remove('active');
            location.reload(); // Reset demo/session upon login
          }, 1500);
        } else {
          authMessage.className = "message error";
          authMessage.textContent = data.error || "Authentication failed.";
        }
      } catch (err) {
        authMessage.className = "message error";
        authMessage.textContent = "Failed to connect to server.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isRegistering ? "Sign Up" : "Log In";
      }
    });

    // Start timer on page load
    window.addEventListener('DOMContentLoaded', () => {
      startDemoTimer();
    });
  </script>
</body>
</html>
